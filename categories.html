<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Category Listings - Baseera Karachi</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#006948",
            "primary-dark": "#005236",
            secondary: "#006c49",
            "secondary-container": "#6cf8bb",
            "on-secondary-container": "#00714d",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f9fafb"
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-gray-100 font-sans antialiased text-[#111827]">

  <div class="app-shell pb-20">
    <!-- Top Header -->
    <header id="app-header"></header>

    <main class="flex-1 w-full pt-16">
      
      <!-- Search & Title Bar -->
      <section class="px-4 pt-4 pb-2 bg-white">
        <div class="flex items-center gap-1.5 text-primary text-xs font-bold uppercase tracking-wider mb-1">
          <span class="material-symbols-outlined text-[16px]">verified</span>
          <span id="categoryBreadcrumb">Karachi Verified Network</span>
        </div>
        <h1 class="text-xl font-bold text-gray-900" id="categoryPageTitle">Top Electricians & Technicians</h1>
        <p class="text-xs text-gray-500 mt-0.5">Verified residential & commercial service providers across Karachi.</p>
        
        <!-- Search bar inside category -->
        <div class="relative w-full mt-3">
          <div class="flex items-center w-full bg-[#f9fafb] border border-gray-200 rounded-xl px-3 py-2 focus-within:bg-white focus-within:border-emerald-600 transition-colors">
            <span class="material-symbols-outlined text-gray-400 text-[20px] mr-2 select-none">search</span>
            <input 
              id="categorySearchInput"
              type="text"
              placeholder="Search by name, neighborhood, or skill..."
              class="w-full bg-transparent text-xs text-gray-900 placeholder:text-gray-400 focus:outline-none"
            />
            <button id="clearSearchBtn" class="hidden text-gray-400 hover:text-gray-600">
              <span class="material-symbols-outlined text-[18px]">close</span>
            </button>
          </div>
        </div>
      </section>

      <!-- Sticky Horizontal Filter Chips -->
      <nav class="sticky top-16 z-30 bg-white/95 backdrop-blur-sm py-2.5 px-4 border-b border-gray-200 overflow-x-auto no-scrollbar">
        <div class="flex items-center gap-2 min-w-max" id="filtersList">
          <button data-filter="all" class="filter-btn active px-3 py-1.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800 border border-emerald-300 transition-colors flex items-center gap-1">
            <span class="material-symbols-outlined text-[15px] filled">check</span>
            All
          </button>
          <button data-filter="individual" class="filter-btn px-3 py-1.5 rounded-full text-xs font-medium bg-white text-gray-700 hover:bg-gray-50 border border-gray-200 transition-colors">
            Individuals
          </button>
          <button data-filter="shop" class="filter-btn px-3 py-1.5 rounded-full text-xs font-medium bg-white text-gray-700 hover:bg-gray-50 border border-gray-200 transition-colors">
            Shops / Agencies
          </button>
          <button data-filter="urgent" class="filter-btn px-3 py-1.5 rounded-full text-xs font-medium bg-white text-gray-700 hover:bg-gray-50 border border-gray-200 transition-colors flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-600 animate-ping"></span>
            Available Now
          </button>
          <button data-filter="dha-clifton" class="filter-btn px-3 py-1.5 rounded-full text-xs font-medium bg-white text-gray-700 hover:bg-gray-50 border border-gray-200 transition-colors">
            DHA & Clifton
          </button>
          <button data-filter="gulshan" class="filter-btn px-3 py-1.5 rounded-full text-xs font-medium bg-white text-gray-700 hover:bg-gray-50 border border-gray-200 transition-colors">
            Gulshan
          </button>
          <button data-filter="pechs" class="filter-btn px-3 py-1.5 rounded-full text-xs font-medium bg-white text-gray-700 hover:bg-gray-50 border border-gray-200 transition-colors">
            PECHS
          </button>
        </div>
      </nav>

      <!-- Provider Directory List -->
      <section class="px-4 py-3 flex flex-col gap-3" id="providersContainer">
        <!-- Rendered via JS -->
      </section>

      <!-- Empty State -->
      <div id="noResultsState" class="hidden px-6 py-12 text-center flex flex-col items-center justify-center">
        <div class="w-16 h-16 rounded-full bg-gray-100 flex items-center justify-center text-gray-400 mb-3">
          <span class="material-symbols-outlined text-[32px]">search_off</span>
        </div>
        <h3 class="text-sm font-bold text-gray-900">No specialists found</h3>
        <p class="text-xs text-gray-500 mt-1 max-w-[240px]">
          Try changing your filter chips or searching for another neighborhood in Karachi.
        </p>
        <button onclick="resetFilters()" class="mt-4 px-4 py-2 bg-emerald-50 text-primary border border-emerald-300 rounded-lg text-xs font-semibold">
          Reset All Filters
        </button>
      </div>

    </main>

    <!-- Bottom Navigation -->
    <nav id="bottom-nav"></nav>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    let currentFilter = 'all';
    let searchQuery = '';
    let selectedCategory = '';

    document.addEventListener('DOMContentLoaded', () => {
      renderHeader({ title: 'Directory', subtitle: 'Karachi', showBack: true, backHref: 'index.html' });
      renderBottomNav('search');

      // Check URL parameters
      const params = new URLSearchParams(window.location.search);
      if (params.get('cat')) {
        selectedCategory = params.get('cat');
        const matched = BASEERA_DATA.categories.find(c => c.id === selectedCategory);
        if (matched) {
          document.getElementById('categoryPageTitle').textContent = `Top ${matched.name}s in Karachi`;
          document.getElementById('categoryBreadcrumb').textContent = `${matched.name} Network`;
        }
      }
      if (params.get('district')) {
        currentFilter = params.get('district');
      }
      if (params.get('q')) {
        searchQuery = params.get('q').toLowerCase();
        document.getElementById('categorySearchInput').value = params.get('q');
        document.getElementById('clearSearchBtn').classList.remove('hidden');
      }

      setupFilterChips();
      setupSearch();
      renderProviders();
    });

    function setupFilterChips() {
      const btns = document.querySelectorAll('.filter-btn');
      btns.forEach(btn => {
        const filterVal = btn.dataset.filter;
        if (filterVal === currentFilter) {
          activateFilterBtn(btn);
        }

        btn.addEventListener('click', () => {
          btns.forEach(b => deactivateFilterBtn(b));
          activateFilterBtn(btn);
          currentFilter = filterVal;
          renderProviders();
        });
      });
    }

    function activateFilterBtn(btn) {
      btn.className = 'filter-btn active px-3 py-1.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800 border border-emerald-300 transition-colors flex items-center gap-1';
    }

    function deactivateFilterBtn(btn) {
      btn.className = 'filter-btn px-3 py-1.5 rounded-full text-xs font-medium bg-white text-gray-700 hover:bg-gray-50 border border-gray-200 transition-colors flex items-center gap-1';
    }

    function setupSearch() {
      const searchInput = document.getElementById('categorySearchInput');
      const clearBtn = document.getElementById('clearSearchBtn');

      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value.trim().toLowerCase();
        clearBtn.classList.toggle('hidden', searchQuery.length === 0);
        renderProviders();
      });

      clearBtn.addEventListener('click', () => {
        searchInput.value = '';
        searchQuery = '';
        clearBtn.classList.add('hidden');
        renderProviders();
      });
    }

    function resetFilters() {
      currentFilter = 'all';
      searchQuery = '';
      selectedCategory = '';
      document.getElementById('categorySearchInput').value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      document.querySelectorAll('.filter-btn').forEach(b => {
        if (b.dataset.filter === 'all') activateFilterBtn(b);
        else deactivateFilterBtn(b);
      });
      renderProviders();
    }

    function renderProviders() {
      const container = document.getElementById('providersContainer');
      const emptyState = document.getElementById('noResultsState');
      container.innerHTML = '';

      let list = BASEERA_DATA.providers;

      // Filter by category if set
      if (selectedCategory) {
        list = list.filter(p => p.category === selectedCategory);
      }

      // Filter by chip
      if (currentFilter === 'individual') {
        list = list.filter(p => p.type === 'individual');
      } else if (currentFilter === 'shop') {
        list = list.filter(p => p.type === 'shop');
      } else if (currentFilter === 'urgent') {
        list = list.filter(p => p.urgentReady === true);
      } else if (currentFilter !== 'all') {
        list = list.filter(p => p.district === currentFilter);
      }

      // Filter by search query
      if (searchQuery) {
        list = list.filter(p => 
          p.name.toLowerCase().includes(searchQuery) ||
          p.businessName.toLowerCase().includes(searchQuery) ||
          p.locality.toLowerCase().includes(searchQuery) ||
          p.tags.some(t => t.toLowerCase().includes(searchQuery))
        );
      }

      if (list.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      list.forEach(pro => {
        const isSaved = StorageService.isSaved(pro.id);
        const card = document.createElement('article');
        card.className = 'bg-white rounded-xl border border-gray-200 p-3.5 flex flex-col gap-3 transition-all hover:border-emerald-600';

        card.innerHTML = `
          <div class="flex items-start gap-3">
            <a href="provider-profile.html?id=${pro.id}" class="relative shrink-0">
              <img class="w-14 h-14 rounded-full object-cover bg-gray-100 border border-gray-200" src="${pro.avatar}" alt="${pro.name}" />
              ${pro.verified ? `
                <div class="absolute -bottom-1 -right-1 bg-white p-0.5 rounded-full flex items-center justify-center shadow-xs">
                  <span class="material-symbols-outlined text-emerald-600 text-[18px] filled">verified</span>
                </div>
              ` : ''}
            </a>

            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between gap-1">
                <a href="provider-profile.html?id=${pro.id}" class="font-bold text-sm text-gray-900 truncate hover:text-primary">
                  ${pro.name}
                </a>
                <button 
                  onclick="toggleBookmark('${pro.id}', '${pro.name}', this)"
                  aria-label="Save Provider" 
                  class="text-gray-400 hover:text-emerald-700 p-1"
                >
                  <span class="material-symbols-outlined text-[20px] ${isSaved ? 'text-primary filled' : ''}">bookmark</span>
                </button>
              </div>

              <div class="flex items-center gap-1.5 mt-0.5">
                <span class="text-xs text-gray-600 truncate">${pro.businessName}</span>
                ${pro.urgentReady ? `
                  <span class="inline-flex items-center gap-1 px-1.5 py-0.2 rounded-full text-[10px] bg-emerald-50 text-emerald-700 font-semibold border border-emerald-200 shrink-0">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-600 animate-pulse"></span>
                    Available
                  </span>
                ` : ''}
              </div>
              
              <div class="flex items-center gap-1 mt-1 text-[11px] text-gray-500">
                <span class="material-symbols-outlined text-[14px] text-gray-400">location_on</span>
                <span class="truncate">${pro.locality}</span>
              </div>

              <div class="flex items-center gap-2 mt-1.5">
                <div class="flex items-center text-amber-500 text-xs font-bold gap-0.5">
                  <span class="material-symbols-outlined text-[15px] filled">star</span>
                  <span>${pro.rating}</span>
                  <span class="text-gray-400 font-normal">(${pro.reviewsCount})</span>
                </div>
                <span class="text-gray-300">•</span>
                <span class="text-[11px] text-gray-500">
                  ${pro.experienceYears} yrs exp.
                </span>
                <span class="text-gray-300">•</span>
                <span class="text-[11px] text-emerald-700 font-semibold">
                  Starts ${pro.rateStarting}
                </span>
              </div>
            </div>
          </div>

          <!-- Tags -->
          <div class="flex items-center gap-1.5 flex-wrap">
            ${pro.tags.map(tag => `
              <span class="text-[10px] bg-gray-50 text-gray-600 px-2 py-0.5 rounded border border-gray-200">
                ${tag}
              </span>
            `).join('')}
          </div>

          <!-- WhatsApp Primary Action -->
          <div class="flex items-center gap-2 pt-1 border-t border-gray-100">
            <button 
              onclick="openWhatsAppLead('${pro.id}')"
              class="flex-1 btn-whatsapp py-2.5 px-3 rounded-lg text-xs font-semibold flex items-center justify-center gap-1.5"
            >
              <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                <path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0 0 12.04 2m.01 1.67c2.2 0 4.26.86 5.82 2.41a8.176 8.176 0 0 1 2.41 5.83c0 4.54-3.7 8.24-8.24 8.24-1.45 0-2.87-.38-4.12-1.11l-.3-.17-3.12.82.83-3.04-.19-.31a8.19 8.19 0 0 1-1.25-4.43c0-4.54 3.69-8.24 8.24-8.24m4.52 11.53c-.25-.13-1.47-.72-1.7-.81-.23-.08-.39-.13-.56.13-.17.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.13-1.06-.39-2.02-1.25-.75-.67-1.26-1.5-1.41-1.75-.15-.25-.02-.39.11-.51.11-.11.25-.29.38-.44.12-.14.17-.25.25-.42.08-.17.04-.31-.02-.44-.06-.13-.56-1.35-.77-1.85-.2-.49-.41-.42-.56-.43h-.48c-.17 0-.44.06-.67.31-.23.25-.88.86-.88 2.1 0 1.24.9 2.44 1.03 2.61.12.17 1.77 2.7 4.29 3.79.6.26 1.07.41 1.43.53.6.19 1.15.16 1.58.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.08.15-1.18-.06-.11-.23-.17-.48-.29z"/>
              </svg>
              Chat on WhatsApp
            </button>
            <a 
              href="provider-profile.html?id=${pro.id}" 
              class="px-3 py-2.5 rounded-lg border border-gray-200 text-xs font-semibold text-gray-700 hover:bg-gray-50 transition-colors"
            >
              Details
            </a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleBookmark(id, name, btn) {
      const isNowSaved = StorageService.toggleSave(id, name);
      const icon = btn.querySelector('.material-symbols-outlined');
      if (isNowSaved) {
        icon.classList.add('text-primary', 'filled');
      } else {
        icon.classList.remove('text-primary', 'filled');
      }
    }
  </script>
</body>
</html>
